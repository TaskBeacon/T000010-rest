task_plot_spec:
  spec_version: '0.2'
  meta:
    task_name: Resting-state Task (EC + EO)
    mode: existing
    task_id: ''
  figure:
    output:
      filename: task_flow.png
      dpi: 300
      width_in: 16.0
      background: white
    layout:
      max_conditions: 4
      screens_per_timeline: 6
      screen_overlap_ratio: 0.1
      screen_slope: 0.08
      screen_slope_deg: 25.0
      timeline_gap: 0.18
      screen_aspect_ratio: 1.4545454545454546
      left_margin: 0.2
      right_margin: 0.03
      top_margin: 0.03
      bottom_margin: 0.05
      condition_label_gap: 0.014
      phase_label_pad: 0.01
      duration_label_gap: 0.006
      timeline_arrow_gap: 0.01
      timeline_arrow_screen_clearance: 0.007
      timeline_arrow_text_clearance: 0.01
      timeline_arrow_extra_per_screen: 0.015
      timeline_arrow_min_y: 0.02
      timeline_arrow_max_y: 0.96
  timelines:
  - condition: EC
    display_condition_label: EC
    phases:
    - phase_name: block instruction
      display_phase_label: Block Instruction
      duration_ms: null
      response_window_ms: null
      display_timing_label: ''
      stim_ids:
      - EC_instruction
      stimulus_example:
        summary: 请您闭上眼睛。
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: 请您闭上眼睛。
          color: white
          pos: null
          height: null
      notes: ''
    - phase_name: fixation
      display_phase_label: Fixation
      duration_ms: null
      response_window_ms: null
      display_timing_label: ''
      stim_ids:
      - EC_stim
      stimulus_example:
        summary: 请闭眼
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: 请闭眼
          color: black
          pos: null
          height: null
      notes: ''
    condition_variants:
    - EO
    display_condition_note: 'Also: EO'
  legend: []
